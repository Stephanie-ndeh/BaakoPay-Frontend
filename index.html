<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D47FF" />

    <title>
      BaakoPay | Plateforme d'Opérations de Paiement pour les Institutions
      Africaines
    </title>
    <meta
      name="description"
      content="BaakoPay offre aux écoles, hôpitaux, entreprises et ONG d'Afrique l'infrastructure pour collecter, suivre et rapprocher les paiements numériquement via MTN MoMo et Orange Money."
    />

    <meta name="robots" content="%VITE_ROBOTS_CONTENT%" />
    <link rel="canonical" href="%VITE_APP_URL%" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BaakoPay",
        "url": "%VITE_APP_URL%",
        "logo": "%VITE_APP_URL%/logo.png",
        "description": "BaakoPay is a payment operations platform giving institutions across Africa — schools, hospitals, businesses, and NGOs — the infrastructure to collect, track, and reconcile payments digitally.",
        "areaServed": "Africa",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Yaoundé",
          "addressCountry": "CM"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "hello@baakopay.com",
          "contactType": "customer service"
        }
      }
    </script>

    <meta
      property="og:title"
      content="BaakoPay | Plateforme d'Opérations de Paiement pour les Institutions Africaines"
    />
    <meta
      property="og:description"
      content="BaakoPay offre aux écoles, hôpitaux, entreprises et ONG d'Afrique l'infrastructure pour collecter, suivre et rapprocher les paiements numériquement via MTN MoMo et Orange Money."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_APP_URL%" />
    <meta property="og:image" content="%VITE_APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="BaakoPay" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="BaakoPay | Payment Operations Infrastructure"
    />
    <meta
      name="twitter:description"
      content="BaakoPay offre aux écoles, hôpitaux, entreprises et ONG d'Afrique l'infrastructure pour collecter, suivre et rapprocher les paiements numériquement via MTN MoMo et Orange Money."
    />
    <meta name="twitter:image" content="%VITE_APP_URL%/og-image.png" />

    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="app"></div>
